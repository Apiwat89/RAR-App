
<!DOCTYPE html>
<html lang="th">
<head>

  <link rel="stylesheet" href="style.css">

    }
    .menu-box {
      background: white;
      padding: 40px;

      text-align: center;
      width: 350px;
    }
    h1 {
      margin-bottom: 30px;
    }
    a.menu-btn {
      display: block;
      padding: 16px;
      background: #4a90e2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 18px;
    }
    a.menu-btn:hover {
      background: #357ab8;
    }
    a.menu-btn2 {
      display: block;
      padding: 16px;
      background: #df4ae2;
      color: white;
      text-decoration: none;
      border-radius: 10px;

    }
    a.menu-btn2:hover {
      background: #a426a7;
    }

</head>
<body>
  <div class="menu-box">
    <h1>เลือกแบบฟอร์ม</h1>

    <a class="menu-btn" href="incumbent.html">แบบฟอร์ม Incumbent</a>
