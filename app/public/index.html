<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>CareerLens APP</title>
  <link rel="icon" type="image/png" href="./uploads/icon/logo2.png"/>
  <link rel="stylesheet" href="global.css">
  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f8fafc;
        background-image: 
            radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
            radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-size: cover;
    }

    .menu-card {
        background: white;
        padding: 48px;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        text-align: center;
        width: 100%;
        max-width: 420px;
        position: relative;
        overflow: hidden;
    }

    .menu-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, var(--accent-color), var(--success-color));
    }

    .logo-container {
        margin-bottom: 24px;
    }

    .logo-container img {
        width: 180px;
        height: auto;
    }

    h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 8px;
    }

    p.subtitle {
        color: var(--text-muted);
        margin-bottom: 32px;
        font-size: 15px;
    }

    .menu-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        background: white;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        margin-bottom: 16px;
        transition: all 0.2s;
        text-align: left;
        color: var(--text-main);
        font-weight: 600;
        font-size: 16px;
        box-shadow: var(--shadow-sm);
    }

    .menu-btn:hover {
        border-color: var(--accent-color);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .menu-btn span {
        margin-left: 60px;
    }

    .menu-btn .icon {
        font-size: 20px;
        color: var(--accent-color);
    }

    .menu-btn:nth-child(2):hover {
        border-color: var(--success-color);
    }
    .menu-btn:nth-child(2) .icon {
        color: var(--success-color);
    }

    .footer {
        margin-top: 32px;
        font-size: 12px;
        color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="menu-card">
    <div class="logo-container">
        <!-- Assuming logo path is correct, adjusting size via CSS -->
        <img src="/uploads/icon/logo.png" alt="CareerLens Logo">
    </div>
    
    <h1>Welcome Back</h1>
    <p class="subtitle">Select a module to continue</p>

    <a class="menu-btn" href="incumbent.html">
        <span>Incumbent Form</span>
        <span class="icon">→</span>
    </a>
    <a class="menu-btn" href="successor.html">
        <span>Successor Form</span>
        <span class="icon">→</span>
    </a>

    <div class="footer">
        © 2025 CareerLens APP. All rights reserved.
    </div>
  </div>
</body>
</html>
